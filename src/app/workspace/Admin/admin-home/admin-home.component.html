<div class="ad-container">
    <header class="ad-header">
        <div class="ad-brandIcon">
            <h1>Forest</h1>
        </div>
        <div class="ad-toolbar"></div>
    </header>
    
    <div class="container-fluid" style="height: 92vh !important;">
        <div class="row" style="height: 100%;">
            <!-- Left Sidebar -->
            <nav class="ad-left-menu col-md-3 col-lg-2 d-md-block sidebar py-4">
                <p-panelmenu [model]="items" styleClass="w-full md:w-80">
                    <ng-template #item let-item>
                        <span pRipple class="flex items-center px-4 cursor-pointer group ad-pe-menu">
                            <i [class]="item.icon + ' menu-icon group-hover:text-inherit'"></i>
                            <span class="ml-2">
                                {{ item.label }}
                            </span>
                        </span>
                    </ng-template>
                </p-panelmenu>
            </nav>
    
            <!-- Content Panel -->
            <main class="col-md-9 col-lg-10 ms-sm-auto px-4 py-4">
                <router-outlet></router-outlet>
            </main>
        </div>
    </div>
    
</div>
